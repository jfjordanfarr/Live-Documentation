<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- The page loads only its own files: no script but its own, no request to any other site. A stylesheet may be
       inline because three of the 3D view's libraries inject theirs; a style can neither run script nor, under the
       rest of this policy, fetch from anywhere. -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Docs Explorer</title>
  <link rel="stylesheet" href="./static/styles.css" />
</head>

<body>
  <div id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Live Docs Explorer</span>
      <button id="history-back" class="sidebar-toggle-btn history-btn" title="Back to the last place" aria-label="Back" disabled>←</button>
      <button id="history-forward" class="sidebar-toggle-btn history-btn" title="Forward to the next place" aria-label="Forward" disabled>→</button>
      <button id="sidebar-toggle" class="sidebar-toggle-btn" title="Collapse sidebar">◀</button>
    </div>

    <!-- View Navigation -->
    <div class="sidebar-section">
      <button class="nav-item" data-view="sources">
        <svg class="nav-icon" viewBox="0 0 24 24" width="20" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h9l4 4v13H6z"/><path d="M15 3.5v4h4M9 11h7M9 14.5h7M9 18h4"/></svg><span>Knowledge Sources</span>
      </button>
      <button class="nav-item" data-view="world">
        <svg class="nav-icon" viewBox="0 0 24 24" width="20" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5 20.5 12 12 20.5 3.5 12z"/></svg><span>World Map</span>
      </button>
      <button class="nav-item" data-view="map">
        <svg class="nav-icon" viewBox="0 0 24 24" width="20" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8.5" y="6.5" width="12" height="11" rx="1.5"/><circle cx="3.8" cy="9.5" r="1.3"/><circle cx="3.8" cy="14.5" r="1.3"/><path d="M5.1 9.5h3.4M5.1 14.5h3.4"/></svg><span>Local Map</span>
      </button>
    </div>

    <!-- Display Filters -->
    <div class="sidebar-section">
      <div class="section-label">Display</div>
      <label class="sidebar-checkbox">
        <input id="filter-toggle-tests" type="checkbox" />
        <span>Show Tests</span>
      </label>
      <label class="sidebar-checkbox">
        <input id="filter-toggle-assets" type="checkbox" />
        <span>Show Assets</span>
      </label>
      <label class="sidebar-checkbox force-graph-only"
        title="Shows the documents the files' own words cite (READMEs, specs, chat summaries) as nodes in the 3D Local Map">
        <input id="filter-toggle-related-docs" type="checkbox" />
        <span>Show Related Docs</span>
      </label>
      <label class="sidebar-checkbox force-graph-only"
        title="Shows the documents whose links name a file, as the file's Cited By section lists them, as nodes in the 3D Local Map">
        <input id="filter-toggle-citing-docs" type="checkbox" />
        <span>Show Citing Docs</span>
      </label>
    </div>

    <!-- Legend -->
    <section id="map-legend" class="sidebar-section" aria-labelledby="map-legend-title">
      <div id="map-legend-title" class="section-label">Legend</div>
      <div id="local-legend">
        <div class="legend-row">
          <span class="legend-swatch legend-swatch--outbound"></span>
          <span>Wire from what offers</span>
        </div>
        <div class="legend-row">
          <span class="legend-swatch legend-swatch--inbound"></span>
          <span>Wire to what uses</span>
        </div>
        <div class="legend-row">
          <span class="legend-symbol legend-symbol--outbound"></span>
          <span>Offers</span>
        </div>
        <div class="legend-row">
          <span class="legend-symbol legend-symbol--inbound"></span>
          <span>Uses</span>
        </div>
        <div class="legend-row">
          <span class="legend-shadow"></span>
          <span>Test-backed</span>
        </div>
      </div>
      <div id="spatial-legend" role="list" aria-label="3D map encodings"></div>
    </section>

    <!-- Tuning Controls (collapsible) -->
    <details class="sidebar-section sidebar-details">
      <summary class="section-label clickable">Tuning</summary>
      <div class="tuning-content">
        <details class="tuning-subsection">
          <summary class="subsection-label">2D Wires</summary>
          <label class="tuning-slider">
            <span>Stub Factor</span>
            <input type="range" id="tuning-stub-factor" min="0.1" max="0.8" step="0.01" value="0.8" />
            <output id="tuning-stub-factor-value">0.8</output>
          </label>
          <label class="tuning-slider">
            <span>Stub Min</span>
            <input type="range" id="tuning-stub-min" min="8" max="64" step="2" value="8" />
            <output id="tuning-stub-min-value">8</output>
          </label>
          <label class="tuning-slider">
            <span>Stub Max Offset</span>
            <input type="range" id="tuning-stub-max-offset" min="8" max="64" step="2" value="40" />
            <output id="tuning-stub-max-offset-value">40</output>
          </label>
          <label class="tuning-slider">
            <span>Vertical Offset</span>
            <input type="range" id="tuning-vertical-offset" min="0" max="0.5" step="0.02" value="0" />
            <output id="tuning-vertical-offset-value">0</output>
          </label>
        </details>
        <details class="tuning-subsection" data-tuning-perspective="2d" open>
          <summary class="subsection-label">2D Layout</summary>
          <label class="tuning-slider">
            <span>Column Gap</span>
            <input type="range" id="tuning-column-gap" min="24" max="160" step="4" value="100" />
            <output id="tuning-column-gap-value">100</output>
          </label>
          <label class="tuning-slider">
            <span>Membrane Evenness</span>
            <input type="range" id="tuning-membrane-evenness" min="0" max="5" step="0.25" value="2" />
            <output id="tuning-membrane-evenness-value">2</output>
          </label>
          <label class="tuning-slider">
            <span>Card Gap</span>
            <input type="range" id="tuning-item-gap" min="8" max="80" step="2" value="24" />
            <output id="tuning-item-gap-value">24</output>
          </label>
          <label class="tuning-slider">
            <span>Directory Gap</span>
            <input type="range" id="tuning-band-gap" min="8" max="80" step="2" value="28" />
            <output id="tuning-band-gap-value">28</output>
          </label>
          <label class="tuning-slider">
            <span>Height Cost</span>
            <input type="range" id="tuning-height-cost" min="0" max="40" step="1" value="5" />
            <output id="tuning-height-cost-value">5</output>
          </label>
          <label class="tuning-slider">
            <span>Membrane Simplicity</span>
            <input type="range" id="tuning-membrane-simplicity" min="0" max="1000" step="10" value="200" />
            <output id="tuning-membrane-simplicity-value">200</output>
          </label>
          <label class="tuning-slider">
            <span>Row Levelness</span>
            <input type="range" id="tuning-row-levelness" min="0" max="5" step="0.25" value="2" />
            <output id="tuning-row-levelness-value">2</output>
          </label>
          <label class="tuning-slider">
            <span>Hover Dim (Symbols)</span>
            <input type="range" id="tuning-hover-dim-symbols" min="0.1" max="0.8" step="0.05" value="0.5" />
            <output id="tuning-hover-dim-symbols-value">0.5</output>
          </label>
          <label class="tuning-slider">
            <span>Hover Dim (Lines)</span>
            <input type="range" id="tuning-hover-dim-connections" min="0.1" max="0.8" step="0.05" value="0.1" />
            <output id="tuning-hover-dim-connections-value">0.1</output>
          </label>
          <label class="tuning-slider">
            <span>Lace Reach</span>
            <input type="range" id="tuning-lace-reach" min="4" max="40" step="1" value="18" />
            <output id="tuning-lace-reach-value">18</output>
          </label>
          <label class="tuning-slider">
            <span>Lace Curl</span>
            <input type="range" id="tuning-lace-curl" min="2" max="30" step="1" value="12" />
            <output id="tuning-lace-curl-value">12</output>
          </label>
          <label class="tuning-slider">
            <span>Lace Width</span>
            <input type="range" id="tuning-lace-width" min="1" max="6" step="0.5" value="2.5" />
            <output id="tuning-lace-width-value">2.5</output>
          </label>
          <label class="tuning-slider">
            <span>Lace Taper</span>
            <input type="range" id="tuning-self-loop-taper" min="0" max="1" step="0.1" value="0.5" />
            <output id="tuning-self-loop-taper-value">0.5</output>
          </label>
          <label class="tuning-slider">
            <span>Symbol Order</span>
            <select id="tuning-symbol-order">
              <option value="layout">Layout</option>
              <option value="alphabetical">Alphabetical</option>
              <option value="appearance">Order of appearance</option>
            </select>
          </label>
          <label class="tuning-slider">
            <span>Move</span>
            <input type="range" id="tuning-move-ms" min="0" max="1200" step="50" value="450" />
            <output id="tuning-move-ms-value">450</output>
          </label>
          <label class="tuning-slider">
            <span>Hold Still</span>
            <select id="tuning-hold-still">
              <option value="click">Last clicked card</option>
              <option value="hover">Last clicked or hovered card</option>
            </select>
          </label>
          <label class="tuning-slider">
            <span>Order Starts</span>
            <input type="range" id="tuning-order-starts" min="0" max="16" step="1" value="2" />
            <output id="tuning-order-starts-value">2</output>
          </label>
          <label class="tuning-slider">
            <span>Search Starts</span>
            <input type="range" id="tuning-search-starts" min="0" max="128" step="4" value="32" />
            <output id="tuning-search-starts-value">32</output>
          </label>
          <label class="tuning-slider">
            <span>Search Patience</span>
            <input type="range" id="tuning-search-patience" min="1" max="32" step="1" value="8" />
            <output id="tuning-search-patience-value">8</output>
          </label>
          <label class="tuning-slider">
            <span>Churn Cost</span>
            <input type="range" id="tuning-churn-cost" min="0" max="400" step="10" value="100" />
            <output id="tuning-churn-cost-value">100</output>
          </label>
        </details>
        <details class="tuning-subsection" data-tuning-perspective="3d">
          <summary class="subsection-label">3D Layout</summary>
          <details class="tuning-subsection" open>
            <summary class="subsection-label">Forces</summary>
            <label class="tuning-slider">
              <span>Repulsion</span><input type="range" id="tuning-force-charge" min="0" max="300" step="5" value="60" />
              <output id="tuning-force-charge-value">60</output>
            </label>
            <label class="tuning-slider">
              <span>Spring Strength</span><input type="range" id="tuning-force-link-strength" min="0" max="2" step="0.05" value="0.5" />
              <output id="tuning-force-link-strength-value">0.5</output>
            </label>
            <label class="tuning-slider">
              <span>Gravity</span><input type="range" id="tuning-force-gravity" min="0" max="0.3" step="0.005" value="0.025" />
              <output id="tuning-force-gravity-value">0.025</output>
            </label>
            <label class="tuning-slider">
              <span>Tether</span><input type="range" id="tuning-force-tether" min="0" max="0.1" step="0.001" value="0.02" />
              <output id="tuning-force-tether-value">0.02</output>
            </label>
            <label class="tuning-slider">
              <span>Citing Pull</span><input type="range" id="tuning-force-cited-by-pull" min="0" max="1" step="0.05" value="1" />
              <output id="tuning-force-cited-by-pull-value">1</output>
            </label>
            <label class="tuning-slider">
              <span>Repulsion Reach</span><input type="range" id="tuning-force-charge-range" min="0" max="1000" step="10" value="0" />
              <output id="tuning-force-charge-range-value">0</output>
            </label>
            <label class="tuning-slider">
              <span>Update Energy</span><input type="range" id="tuning-force-update-energy" min="0" max="1" step="0.01" value="1" />
              <output id="tuning-force-update-energy-value">1</output>
            </label>
            <label class="tuning-slider">
              <span>Approximation</span><input type="range" id="tuning-force-approximation" min="0" max="0.5" step="0.05" value="0.3" />
              <output id="tuning-force-approximation-value">0.3</output>
            </label>
          </details>
          <details class="tuning-subsection" open>
            <summary class="subsection-label">Spacing</summary>
            <label class="tuning-slider">
              <span>Link Gap</span><input type="range" id="tuning-force-link-gap" min="8" max="200" step="2" value="60" />
              <output id="tuning-force-link-gap-value">60</output>
            </label>
            <label class="tuning-slider">
              <span>Coupling</span><input type="range" id="tuning-force-coupling" min="0" max="3" step="0.1" value="1" />
              <output id="tuning-force-coupling-value">1</output>
            </label>
            <label class="tuning-slider">
              <span>Clearance</span><input type="range" id="tuning-force-collision-gap" min="0" max="20" step="0.5" value="5" />
              <output id="tuning-force-collision-gap-value">5</output>
            </label>
          </details>
          <details class="tuning-subsection" open>
            <summary class="subsection-label">Appearance</summary>
            <label class="tuning-slider">
              <span>Base Radius</span><input type="range" id="tuning-force-node-size" min="1" max="10" step="0.25" value="4" />
              <output id="tuning-force-node-size-value">4</output>
            </label>
            <label class="tuning-slider">
              <span>Symbol Scaling</span><input type="range" id="tuning-force-symbol-scale" min="0" max="2" step="0.1" value="1" />
              <output id="tuning-force-symbol-scale-value">1</output>
            </label>
            <label class="tuning-slider">
              <span>Wire Thickness</span><input type="range" id="tuning-force-link-width" min="0.1" max="4" step="0.1" value="1" />
              <output id="tuning-force-link-width-value">1</output>
            </label>
            <label class="tuning-slider">
              <span>Node Zoom Resistance</span><input type="range" id="tuning-force-node-zoom-resistance" min="0" max="1" step="0.05" value="0.3" />
              <output id="tuning-force-node-zoom-resistance-value">0.3</output>
            </label>
            <label class="tuning-slider">
              <span>Wire Zoom Resistance</span><input type="range" id="tuning-force-wire-zoom-resistance" min="0" max="1" step="0.05" value="0.9" />
              <output id="tuning-force-wire-zoom-resistance-value">0.9</output>
            </label>
          </details>
        </details>
        <details class="tuning-subsection" data-tuning-perspective="3d">
          <summary class="subsection-label">History</summary>
          <label class="tuning-slider">
            <span>Axis</span>
            <select id="tuning-history-axis">
              <option value="time">By date</option>
              <option value="steps">By step</option>
            </select>
          </label>
          <label class="tuning-slider">
            <span>Ticks</span>
            <select id="tuning-history-granularity">
              <option value="auto">Automatic</option>
              <option value="step">Every step</option>
              <option value="day">Days</option>
              <option value="week">Weeks</option>
              <option value="month">Months</option>
              <option value="salient">Salient only</option>
            </select>
          </label>
          <label class="tuning-slider">
            <span>Play Rate</span><input type="range" id="tuning-history-play-rate" min="0.5" max="10" step="0.5" value="2" />
            <output id="tuning-history-play-rate-value">2</output>
          </label>
        </details>
        <button id="export-layout-settings" type="button" class="tuning-export">Export layout settings</button>
      </div>
    </details>

    <!-- Stats (at bottom) -->
    <div id="context-bar" class="sidebar-section sidebar-footer">
      <div id="stats-line">Loading...</div>
      <div>Context: <span id="context-name">None</span></div>
    </div>
  </div>

  <div id="main">
    <!-- One search for the whole Explorer; the second field, the end of a path, appears once anything is pinned -->
    <div id="search-bar" class="search-bar" role="search">
      <div class="search-field" id="search-subject-field">
        <input type="text" id="search-subject" class="search-input" placeholder="Search files, symbols and directories"
          aria-label="Search files, symbols and directories; a chosen one is pinned, and a path starts from the newest pin" autocomplete="off" />
        <kbd class="search-shortcut" aria-hidden="true">Ctrl+P</kbd>
        <div id="search-subject-results" class="search-results" hidden></div>
      </div>
      <span id="search-subject-absence" class="search-absence" hidden></span>
      <div class="search-field search-field--destination" id="search-destination-field" hidden>
        <svg class="search-marker" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 21s-6-5.6-6-10a6 6 0 0 1 12 0c0 4.4-6 10-6 10Z" />
          <circle cx="12" cy="11" r="2.5" />
        </svg>
        <input type="text" id="search-destination" class="search-input" placeholder="Path to…"
          aria-label="The end of a path from the newest pin" autocomplete="off" />
        <button type="button" id="search-destination-clear" class="search-clear" aria-label="Clear the path" hidden>&times;</button>
        <div id="search-destination-results" class="search-results" hidden></div>
      </div>
      <span id="search-destination-absence" class="search-absence" hidden></span>
    </div>

    <!-- One path report for both Local Map representations; other views keep the question without showing its report -->
    <section id="path-report" class="path-report" aria-label="Path result" hidden>
      <p id="pathfind-status" class="pathfind-status" role="status" aria-atomic="true" hidden></p>
      <ol id="pathfind-path" class="pathfind-path" aria-label="Path files, from provider to consumer" hidden></ol>
    </section>

    <!-- The views, under the bar and report; the detail panel and the zoom controls stand over them -->
    <div id="views">
    <div id="view-world" class="view-container">
      <div id="world-root" class="world-root"></div>
    </div>

    <div id="view-sources" class="view-container">
      <div id="sources-container" class="sources-view"></div>
    </div>

    <div id="view-map" class="view-container">
      <div id="map-viewport" class="viewport-layer">
        <div id="map-container" class="dom-layer"></div>
        <div id="map-connections" class="connections-layer"></div>
      </div>
    </div>

    <div id="view-graph" class="view-container">
      <div id="graph-svg"></div>
    </div>

    <!-- Floating zoom controls -->
    <div id="controls">
      <button class="control-btn" data-zoom="in" aria-label="Zoom In">+</button>
      <button class="control-btn" data-zoom="out" aria-label="Zoom Out">-</button>
      <button class="control-btn" data-zoom="reset" aria-label="Reset Zoom">⟲</button>
    </div>

    <!-- Detail panel (right sidebar) -->
    <div id="detail-panel" role="complementary" aria-labelledby="detail-title" aria-hidden="true" inert>
      <div class="detail-header">
        <div class="detail-navigation">
          <button id="reader-back" class="sidebar-toggle-btn history-btn" title="Back" aria-label="Back" disabled>←</button>
          <button id="reader-forward" class="sidebar-toggle-btn history-btn" title="Forward" aria-label="Forward" disabled>→</button>
        </div>
        <h2 id="detail-title">Select a Node</h2>
        <button id="detail-close" class="detail-close" aria-label="Close details">×</button>
      </div>
      <div id="detail-body" class="detail-scroll">
        <p class="detail-placeholder">Click on any node to view details.</p>
      </div>
      <div class="detail-footer">
        <button class="action-btn ghost" id="download-doc-btn">Download Markdown</button>
      </div>
    </div>
    </div>
  </div>

  <script type="module" src="./static/index.js"></script>
</body>

</html>
