<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Live Docs Explorer</title>
  <link rel="stylesheet" href="./static/styles.css" />
</head>

<body>
  <!-- Omnisearch (VS Code Command Palette style) -->
  <div id="omnisearch" class="omnisearch" hidden>
    <div class="omnisearch-backdrop"></div>
    <div class="omnisearch-dialog">
      <input type="text" id="omnisearch-input" class="omnisearch-input" placeholder="Search files and symbols..."
        autocomplete="off" />
      <div id="omnisearch-results" class="omnisearch-results"></div>
    </div>
  </div>

  <div id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Live Docs Explorer</span>
      <button id="history-back" class="sidebar-toggle-btn history-btn" title="Back to the last place" aria-label="Back" disabled>←</button>
      <button id="history-forward" class="sidebar-toggle-btn history-btn" title="Forward to the next place" aria-label="Forward" disabled>→</button>
      <button id="sidebar-toggle" class="sidebar-toggle-btn" onclick="toggleSidebar()"
        title="Collapse sidebar">◀</button>
    </div>

    <!-- View Navigation -->
    <div class="sidebar-section">
      <div class="nav-item" data-view="world" onclick="switchView(event, 'world')">
        <span class="nav-icon nav-icon--world"></span><span>World Map</span>
      </div>
      <div class="nav-item" data-view="sources" onclick="switchView(event, 'sources')">
        <span class="nav-icon"></span><span>Knowledge Sources</span>
      </div>
      <div class="nav-item" data-view="circuit" onclick="switchView(event, 'circuit')">
        <span class="nav-icon"></span><span>Circuit Board</span>
      </div>
      <div class="nav-item" data-view="map" onclick="switchView(event, 'map')">
        <span class="nav-icon"></span><span>Local Map</span>
      </div>
      <div class="nav-item active" data-view="membrane" onclick="switchView(event, 'membrane')">
        <span class="nav-icon"></span><span>Membrane Map</span>
      </div>
      <div class="nav-item" data-view="graph" onclick="switchView(event, 'graph')">
        <span class="nav-icon"></span><span>Force Graph</span>
      </div>
    </div>

    <!-- Search Trigger -->
    <div class="sidebar-section">
      <button id="omnisearch-trigger" class="sidebar-search-btn" onclick="openOmnisearch()">
        <span>Search...</span>
        <kbd class="search-shortcut">Ctrl+P</kbd>
      </button>
    </div>

    <!-- Display Filters -->
    <div class="sidebar-section">
      <div class="section-label">Display</div>
      <label class="sidebar-checkbox">
        <input id="filter-toggle-tests" type="checkbox" />
        <span>Show Tests</span>
      </label>
      <label class="sidebar-checkbox">
        <input id="filter-toggle-assets" type="checkbox" />
        <span>Show Assets</span>
      </label>
      <label class="sidebar-checkbox force-graph-only"
        title="Shows related documentation (READMEs, specs, chat history) as nodes in Force Graph view">
        <input id="filter-toggle-related-docs" type="checkbox" />
        <span>Show Related Docs</span>
      </label>
    </div>

    <!-- Tuning Controls (collapsible) -->
    <details class="sidebar-section sidebar-details">
      <summary class="section-label clickable">Tuning</summary>
      <div class="tuning-content">
        <div class="tuning-subsection">
          <div class="subsection-label">Bezier Curve</div>
          <label class="tuning-slider">
            <span>Stub Factor</span>
            <input type="range" id="tuning-stub-factor" min="0.1" max="0.8" step="0.01" value="0.8" />
            <output id="tuning-stub-factor-value">0.8</output>
          </label>
          <label class="tuning-slider">
            <span>Stub Min</span>
            <input type="range" id="tuning-stub-min" min="8" max="64" step="2" value="8" />
            <output id="tuning-stub-min-value">8</output>
          </label>
          <label class="tuning-slider">
            <span>Stub Max Offset</span>
            <input type="range" id="tuning-stub-max-offset" min="8" max="64" step="2" value="40" />
            <output id="tuning-stub-max-offset-value">40</output>
          </label>
          <label class="tuning-slider">
            <span>Vertical Offset</span>
            <input type="range" id="tuning-vertical-offset" min="0" max="0.5" step="0.02" value="0" />
            <output id="tuning-vertical-offset-value">0</output>
          </label>
        </div>
        <div class="tuning-subsection">
          <div class="subsection-label">Local Map</div>
          <label class="tuning-slider">
            <span>Column Gap</span>
            <input type="range" id="tuning-column-gap" min="24" max="160" step="4" value="100" />
            <output id="tuning-column-gap-value">100</output>
          </label>
          <label class="tuning-slider" title="What a step in a directory's outline between neighbouring columns costs the layout, in wires per pixel: at zero the outline follows its files; higher, it tends to a rectangle">
            <span>Membrane Evenness</span>
            <input type="range" id="tuning-membrane-evenness" min="0" max="5" step="0.25" value="1" />
            <output id="tuning-membrane-evenness-value">1</output>
          </label>
          <label class="tuning-slider" title="What a difference between the tops of a directory's cards in neighbouring columns costs, in wires per pixel: at zero each card stands where its wires are shortest; higher, the cards stand in rows">
            <span>Row Levelness</span>
            <input type="range" id="tuning-row-levelness" min="0" max="5" step="0.25" value="0" />
            <output id="tuning-row-levelness-value">0</output>
          </label>
          <label class="tuning-slider">
            <span>Hover Dim (Symbols)</span>
            <input type="range" id="tuning-hover-dim-symbols" min="0.1" max="0.8" step="0.05" value="0.5" />
            <output id="tuning-hover-dim-symbols-value">0.5</output>
          </label>
          <label class="tuning-slider">
            <span>Hover Dim (Lines)</span>
            <input type="range" id="tuning-hover-dim-connections" min="0.1" max="0.8" step="0.05" value="0.1" />
            <output id="tuning-hover-dim-connections-value">0.1</output>
          </label>
          <label class="tuning-slider" title="How far beyond the card's edge a self-reference's lace sweeps before it turns back">
            <span>Lace Reach</span>
            <input type="range" id="tuning-lace-reach" min="4" max="40" step="1" value="18" />
            <output id="tuning-lace-reach-value">18</output>
          </label>
          <label class="tuning-slider" title="How far along the card's edge from its pin's row a lace comes back, toward its partner's row, where the card's edge cuts it">
            <span>Lace Curl</span>
            <input type="range" id="tuning-lace-curl" min="2" max="30" step="1" value="12" />
            <output id="tuning-lace-curl-value">12</output>
          </label>
          <label class="tuning-slider" title="A lace's width where it leaves the pin">
            <span>Lace Width</span>
            <input type="range" id="tuning-lace-width" min="1" max="6" step="0.5" value="2.5" />
            <output id="tuning-lace-width-value">2.5</output>
          </label>
          <label class="tuning-slider" title="How much a lace thins by the card's edge">
            <span>Lace Taper</span>
            <input type="range" id="tuning-self-loop-taper" min="0" max="1" step="0.1" value="0.5" />
            <output id="tuning-self-loop-taper-value">0.5</output>
          </label>
          <label class="tuning-slider" title="References that skip columns or read against them; at this many the Local Map suggests the Force Graph">
            <span>Dense Picture Nudge</span>
            <input type="range" id="tuning-strain-nudge" min="0" max="400" step="8" value="48" />
            <output id="tuning-strain-nudge-value">48</output>
          </label>
          <label class="tuning-slider" title="How a card's symbol rows stand: where their wires lead, which only the many-file layout can choose; alphabetically; or as the file lists them">
            <span>Symbol Order</span>
            <select id="tuning-symbol-order">
              <option value="layout">Layout</option>
              <option value="alphabetical">Alphabetical</option>
              <option value="appearance">Order of appearance</option>
            </select>
          </label>
          <label class="tuning-slider" title="How long the picture takes to move from one arrangement to the next, in milliseconds; zero jumps">
            <span>Move</span>
            <input type="range" id="tuning-move-ms" min="0" max="1200" step="50" value="450" />
            <output id="tuning-move-ms-value">450</output>
          </label>
          <label class="tuning-slider" title="Which card stays put on screen while the picture moves around it">
            <span>Hold Still</span>
            <select id="tuning-hold-still">
              <option value="click">Last clicked card</option>
              <option value="hover">Last clicked or hovered card</option>
            </select>
          </label>
          <label class="tuning-slider" title="How many shuffled starts the order step tries before the first picture is drawn, beside the ranking's own order and the previous picture's">
            <span>Order Starts</span>
            <input type="range" id="tuning-order-starts" min="0" max="16" step="1" value="2" />
            <output id="tuning-order-starts-value">2</output>
          </label>
          <label class="tuning-slider" title="How many further starts the search may try after the first picture, one per idle moment, moving to a better one when it clears the churn cost; zero turns the search off">
            <span>Search Starts</span>
            <input type="range" id="tuning-search-starts" min="0" max="128" step="4" value="32" />
            <output id="tuning-search-starts-value">32</output>
          </label>
          <label class="tuning-slider" title="How many starts in a row may fail to better the best picture found before the search rests until the picture changes">
            <span>Search Patience</span>
            <input type="range" id="tuning-search-patience" min="1" max="32" step="1" value="8" />
            <output id="tuning-search-patience-value">8</output>
          </label>
          <label class="tuning-slider" title="What one pair of cards swapped against the picture on screen costs when a start is priced, in pixels of wire; zero moves to any better picture">
            <span>Churn Cost</span>
            <input type="range" id="tuning-churn-cost" min="0" max="400" step="10" value="100" />
            <output id="tuning-churn-cost-value">100</output>
          </label>
        </div>
      </div>
    </details>

    <!-- Legend -->
    <div class="sidebar-section">
      <div class="section-label">Legend</div>
      <div class="legend-row">
        <span class="legend-swatch legend-swatch--outbound"></span>
        <span>Wire from what offers</span>
      </div>
      <div class="legend-row">
        <span class="legend-swatch legend-swatch--inbound"></span>
        <span>Wire to what uses</span>
      </div>
      <div class="legend-row">
        <span class="legend-symbol legend-symbol--outbound"></span>
        <span>Offers</span>
      </div>
      <div class="legend-row">
        <span class="legend-symbol legend-symbol--inbound"></span>
        <span>Uses</span>
      </div>
      <div class="legend-row">
        <span class="legend-shadow"></span>
        <span>Test-backed</span>
      </div>
    </div>

    <!-- Stats (at bottom) -->
    <div id="context-bar" class="sidebar-section sidebar-footer">
      <div id="stats-line">Loading...</div>
      <div>Context: <span id="context-name">None</span></div>
    </div>
  </div>

  <div id="main">
    <div id="view-world" class="view-container">
      <div id="world-root" class="world-root"></div>
    </div>

    <div id="view-sources" class="view-container">
      <div id="sources-container" class="sources-view"></div>
    </div>

    <div id="view-circuit" class="view-container">
      <div id="circuit-viewport">
        <div id="circuit-container" class="dom-layer"></div>
        <div id="circuit-connections" class="connections-layer"></div>
      </div>
    </div>

    <div id="view-map" class="view-container">
      <!-- Pathfind Toolbar for FROM/TO symbol navigation -->
      <div id="pathfind-toolbar" class="pathfind-toolbar">
        <div class="pathfind-bar">
          <div class="pathfind-group" id="pathfind-from-group">
            <label class="pathfind-label">FROM</label>
            <div class="pathfind-input-wrapper">
              <input type="text" id="pathfind-from" class="pathfind-input" placeholder="Search artifact..."
                autocomplete="off" />
              <button id="pathfind-from-clear" class="pathfind-input-clear" hidden
                aria-label="Clear FROM">&times;</button>
              <!-- Dropdown results for FROM search -->
              <div id="pathfind-from-results" class="pathfind-results" hidden></div>
            </div>
            <select id="pathfind-from-symbol" class="pathfind-symbol-dropdown" hidden>
              <option value="">All symbols</option>
            </select>
          </div>
          <span class="pathfind-arrow">→</span>
          <div class="pathfind-group" id="pathfind-to-group">
            <label class="pathfind-label">TO</label>
            <div class="pathfind-input-wrapper">
              <input type="text" id="pathfind-to" class="pathfind-input" placeholder="Search artifact..."
                autocomplete="off" />
              <button id="pathfind-to-clear" class="pathfind-input-clear" hidden aria-label="Clear TO">&times;</button>
              <!-- Dropdown results for TO search -->
              <div id="pathfind-to-results" class="pathfind-results" hidden></div>
            </div>
            <select id="pathfind-to-symbol" class="pathfind-symbol-dropdown" hidden>
              <option value="">All symbols</option>
            </select>
          </div>
          <div class="pathfind-actions">
            <button id="pathfind-go" class="action-btn" disabled>Find Path</button>
            <button id="pathfind-clear" class="action-btn ghost">Clear</button>
          </div>
        </div>
        <!-- What the search found: a count, or no path with the reverse question offered as a link -->
        <p id="pathfind-status" class="pathfind-status" hidden></p>
        <!-- Path visualization strip -->
        <div id="pathfind-path" class="pathfind-path" hidden></div>
      </div>
      <div id="map-viewport" class="viewport-layer">
        <div id="map-container" class="dom-layer"></div>
        <div id="map-connections" class="connections-layer"></div>
      </div>
    </div>

    <div id="view-membrane" class="view-container active">
      <div id="membrane-viewport">
        <div id="membrane-container"></div>
        <div id="membrane-connections"></div>
      </div>
    </div>

    <div id="view-graph" class="view-container">
      <div id="graph-svg"></div>
    </div>

    <!-- Floating zoom controls -->
    <div id="controls">
      <button class="control-btn" onclick="zoomIn()" aria-label="Zoom In">+</button>
      <button class="control-btn" onclick="zoomOut()" aria-label="Zoom Out">-</button>
      <button class="control-btn" onclick="resetZoom()" aria-label="Reset Zoom">⟲</button>
    </div>

    <!-- Detail panel (right sidebar) -->
    <div id="detail-panel">
      <div class="detail-header">
        <h2 id="detail-title">Select a Node</h2>
        <button id="detail-close" class="detail-close" aria-label="Close details">×</button>
      </div>
      <div id="detail-body" class="detail-scroll">
        <p class="detail-placeholder">Click on any node to view details.</p>
      </div>
      <div class="detail-footer">
        <button class="action-btn ghost" onclick="openInCircuitBoard()">Open in Circuit Board</button>
        <button class="action-btn ghost" onclick="openInLocalView()">Open in Local View</button>
        <button class="action-btn ghost" onclick="openInMembraneMap()">Open in Membrane Map</button>
        <button class="action-btn ghost" onclick="openInGraphView()">Open in Graph View</button>
        <button class="action-btn ghost" id="download-doc-btn" onclick="downloadCurrentDoc()">Download Markdown</button>
      </div>
    </div>
  </div>

  <script type="module" src="./static/index.js"></script>
</body>

</html>
