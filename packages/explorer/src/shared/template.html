<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- The page loads only its own files: no script but its own, no request to any other site. A style may be inline
       because the Explorer's own code writes style attributes into markup it builds (a folder's indent in Knowledge
       Sources, a card's marble shares, the World Map's key); the 3D libraries that once injected stylesheets left on
       2026-10-29. A style can neither run script nor, under the rest of this policy, fetch from anywhere. -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Docs Explorer</title>
  <link rel="stylesheet" href="./static/styles.css" />
</head>

<body>
  <!-- The first stop of the keyboard, shown only while focused: past the sidebar to the map (WCAG 2.2 SC 2.4.1) -->
  <a class="skip-link" href="#views">Skip to the map</a>
  <div id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Live Docs Explorer</span>
      <button id="history-back" class="sidebar-toggle-btn history-btn" title="Back to the last place" aria-label="Back" disabled>←</button>
      <button id="history-forward" class="sidebar-toggle-btn history-btn" title="Forward to the next place" aria-label="Forward" disabled>→</button>
      <button id="sidebar-toggle" class="sidebar-toggle-btn" title="Collapse sidebar">◀</button>
    </div>

    <!-- View Navigation -->
    <nav class="sidebar-section" aria-label="Views">
      <button class="nav-item" data-view="sources">
        <svg class="nav-icon" viewBox="0 0 24 24" width="20" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h9l4 4v13H6z"/><path d="M15 3.5v4h4M9 11h7M9 14.5h7M9 18h4"/></svg><span>Knowledge Sources</span>
      </button>
      <button class="nav-item" data-view="world">
        <svg class="nav-icon" viewBox="0 0 24 24" width="20" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5 20.5 12 12 20.5 3.5 12z"/></svg><span>World Map</span>
      </button>
      <button class="nav-item" data-view="map">
        <svg class="nav-icon" viewBox="0 0 24 24" width="20" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8.5" y="6.5" width="12" height="11" rx="1.5"/><circle cx="3.8" cy="9.5" r="1.3"/><circle cx="3.8" cy="14.5" r="1.3"/><path d="M5.1 9.5h3.4M5.1 14.5h3.4"/></svg><span>Local Map</span>
      </button>
    </nav>

    <!-- Display Filters -->
    <div class="sidebar-section">
      <div class="section-label">Display</div>
      <label class="sidebar-checkbox">
        <input id="filter-toggle-tests" type="checkbox" />
        <span>Show Tests</span>
      </label>
      <label class="sidebar-checkbox">
        <input id="filter-toggle-assets" type="checkbox" />
        <span>Show Assets</span>
      </label>
      <label class="sidebar-checkbox force-graph-only"
        title="Shows the documents the files' own words cite (READMEs, specs, chat summaries) as nodes in the 3D Local Map">
        <input id="filter-toggle-related-docs" type="checkbox" />
        <span>Show Related Docs</span>
      </label>
      <label class="sidebar-checkbox force-graph-only"
        title="Shows the documents whose links name a file, as the file's Cited By section lists them, as nodes in the 3D Local Map">
        <input id="filter-toggle-citing-docs" type="checkbox" />
        <span>Show Citing Docs</span>
      </label>
    </div>

    <!-- Legend -->
    <section id="map-legend" class="sidebar-section" aria-labelledby="map-legend-title">
      <div id="map-legend-title" class="section-label">Legend</div>
      <div id="local-legend" role="list" aria-label="2D map encodings">
        <div class="legend-row legend-row--roles" role="listitem"
          title="A wire runs from what one file offers, in blue, to the file that uses it, in green. On a card, what the file uses enters on the left and what it offers leaves on the right."
          aria-description="A wire runs from what one file offers, in blue, to the file that uses it, in green. On a card, what the file uses enters on the left and what it offers leaves on the right.">
          <span class="legend-word">Offers</span>
          <span class="legend-roles" aria-hidden="true"><span class="legend-symbol legend-symbol--outbound"></span><span class="legend-swatch"></span><span class="legend-symbol legend-symbol--inbound"></span></span>
          <span class="legend-word">Uses</span>
        </div>
        <div class="legend-row" role="listitem"
          title="A card in this border and halo: tests use the file, and the card names them."
          aria-description="A card in this border and halo: tests use the file, and the card names them.">
          <span class="legend-shadow" aria-hidden="true"></span>
          <span class="legend-word">Test-backed</span>
        </div>
        <div class="legend-row legend-row--gathered" role="listitem"
          title="Width: the number of references between two files."
          aria-description="Width: the number of references between two files.">
          <span class="spatial-legend-sample spatial-legend-sample--width" aria-hidden="true"></span>
          <span class="legend-word">References</span>
        </div>
        <!-- The kinds' key, drawn while a closed directory's coloured cells are on screen. Without this one line the 2D legend has no such row, and a cell's hover, which says its file's name, is the colours' only key. -->
        <div id="local-legend-kinds" class="legend-row legend-row--kinds" role="listitem" title="Colour: the kind of file a cell stands for. A cell says its file's name on hover." aria-description="Colour: the kind of file a cell stands for. A cell says its file's name on hover."></div>
      </div>
      <div id="spatial-legend" role="list" aria-label="3D map encodings"></div>
    </section>

    <!-- Tuning Controls (collapsible) -->
    <details class="sidebar-section sidebar-details">
      <summary class="section-label clickable"><span>Tuning</span><span id="tuning-changed" class="tuning-changed" hidden><span id="tuning-changed-count" aria-hidden="true"></span><span id="tuning-changed-words" class="visually-hidden"></span></span></summary>
      <div class="tuning-content">
        <!-- Reset to defaults: the World Map's Reset layout glyph, a toggle pressed while a second press can take the reset back. -->
        <div class="tuning-head">
          <button id="tuning-reset" type="button" class="tuning-reset" aria-label="Reset to defaults" title="Reset to defaults" aria-pressed="false" disabled><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
        </div>
        <details class="tuning-subsection">
          <summary class="subsection-label">Colour</summary>
          <label class="tuning-slider">
            <span>Palette</span>
            <select id="tuning-palette">
              <option value="today" selected>Today</option>
              <option value="proposed">Proposed</option>
              <option value="vividKinds">Vivid kinds</option>
            </select>
          </label>
          <label class="tuning-slider">
            <span>Marbles</span>
            <select id="tuning-marbles">
              <option value="off" selected>Off</option>
              <option value="on">On</option>
            </select>
          </label>
        </details>
        <details class="tuning-subsection">
          <summary class="subsection-label">2D Wires</summary>
          <label class="tuning-slider">
            <span>Stub Factor</span>
            <input type="range" id="tuning-stub-factor" min="0.1" max="0.8" step="0.01" value="0.8" />
            <output id="tuning-stub-factor-value">0.8</output>
          </label>
          <label class="tuning-slider">
            <span>Stub Min</span>
            <input type="range" id="tuning-stub-min" min="8" max="64" step="2" value="8" />
            <output id="tuning-stub-min-value">8</output>
          </label>
          <label class="tuning-slider">
            <span>Stub Max Offset</span>
            <input type="range" id="tuning-stub-max-offset" min="8" max="64" step="2" value="40" />
            <output id="tuning-stub-max-offset-value">40</output>
          </label>
          <label class="tuning-slider">
            <span>Vertical Offset</span>
            <input type="range" id="tuning-vertical-offset" min="0" max="0.5" step="0.02" value="0" />
            <output id="tuning-vertical-offset-value">0</output>
          </label>
          <label class="tuning-slider">
            <span>Wire Answers</span>
            <select id="tuning-wire-answers">
              <option value="on" selected>On</option>
              <option value="off">Off</option>
            </select>
          </label>
          <label class="tuning-slider">
            <span>Direction Marks</span>
            <select id="tuning-direction-marks">
              <option value="none" selected>None</option>
              <option value="along">Along</option>
              <option value="against">Against</option>
            </select>
          </label>
        </details>
        <details class="tuning-subsection" data-tuning-perspective="2d" open>
          <summary class="subsection-label">2D Layout</summary>
          <label class="tuning-slider">
            <span>Column Gap</span>
            <input type="range" id="tuning-column-gap" min="24" max="160" step="4" value="100" />
            <output id="tuning-column-gap-value">100</output>
          </label>
          <label class="tuning-slider">
            <span>Membrane Evenness</span>
            <input type="range" id="tuning-membrane-evenness" min="0" max="5" step="0.25" value="2" />
            <output id="tuning-membrane-evenness-value">2</output>
          </label>
          <label class="tuning-slider">
            <span>Card Gap</span>
            <input type="range" id="tuning-item-gap" min="8" max="80" step="2" value="24" />
            <output id="tuning-item-gap-value">24</output>
          </label>
          <label class="tuning-slider">
            <span>Directory Gap</span>
            <input type="range" id="tuning-band-gap" min="8" max="80" step="2" value="28" />
            <output id="tuning-band-gap-value">28</output>
          </label>
          <label class="tuning-slider">
            <span>Height Cost</span>
            <input type="range" id="tuning-height-cost" min="0" max="40" step="1" value="5" />
            <output id="tuning-height-cost-value">5</output>
          </label>
          <label class="tuning-slider">
            <span>Width Cost</span>
            <input type="range" id="tuning-width-cost" min="0" max="40" step="1" value="5" />
            <output id="tuning-width-cost-value">5</output>
          </label>
          <label class="tuning-slider">
            <span>Return Cost</span>
            <input type="range" id="tuning-return-cost" min="0" max="5000" step="25" value="1500" />
            <output id="tuning-return-cost-value">1500</output>
          </label>
          <label class="tuning-slider">
            <span>Membrane Simplicity</span>
            <input type="range" id="tuning-membrane-simplicity" min="0" max="1000" step="10" value="200" />
            <output id="tuning-membrane-simplicity-value">200</output>
          </label>
          <label class="tuning-slider">
            <span>Row Levelness</span>
            <input type="range" id="tuning-row-levelness" min="0" max="5" step="0.25" value="2" />
            <output id="tuning-row-levelness-value">2</output>
          </label>
          <label class="tuning-slider">
            <span>Hover Dim (Symbols)</span>
            <input type="range" id="tuning-hover-dim-symbols" min="0.1" max="0.8" step="0.05" value="0.5" />
            <output id="tuning-hover-dim-symbols-value">0.5</output>
          </label>
          <label class="tuning-slider">
            <span>Hover Dim (Lines)</span>
            <input type="range" id="tuning-hover-dim-connections" min="0.1" max="0.8" step="0.05" value="0.1" />
            <output id="tuning-hover-dim-connections-value">0.1</output>
          </label>
          <label class="tuning-slider">
            <span>Lace Reach</span>
            <input type="range" id="tuning-lace-reach" min="4" max="40" step="1" value="18" />
            <output id="tuning-lace-reach-value">18</output>
          </label>
          <label class="tuning-slider">
            <span>Lace Curl</span>
            <input type="range" id="tuning-lace-curl" min="2" max="30" step="1" value="12" />
            <output id="tuning-lace-curl-value">12</output>
          </label>
          <label class="tuning-slider">
            <span>Lace Width</span>
            <input type="range" id="tuning-lace-width" min="1" max="6" step="0.5" value="2.5" />
            <output id="tuning-lace-width-value">2.5</output>
          </label>
          <label class="tuning-slider">
            <span>Lace Taper</span>
            <input type="range" id="tuning-self-loop-taper" min="0" max="1" step="0.1" value="0.5" />
            <output id="tuning-self-loop-taper-value">0.5</output>
          </label>
          <label class="tuning-slider">
            <span>Symbol Order</span>
            <select id="tuning-symbol-order">
              <option value="layout">Layout</option>
              <option value="alphabetical">Alphabetical</option>
              <option value="appearance">Order of appearance</option>
            </select>
          </label>
          <label class="tuning-slider">
            <span>Move</span>
            <input type="range" id="tuning-move-ms" min="0" max="1200" step="50" value="450" />
            <output id="tuning-move-ms-value">450</output>
          </label>
          <label class="tuning-slider">
            <span>Hold Still</span>
            <select id="tuning-hold-still">
              <option value="click">Last clicked card</option>
              <option value="hover">Last clicked or hovered card</option>
            </select>
          </label>
          <label class="tuning-slider">
            <span>Card Text</span>
            <select id="tuning-card-text">
              <option value="slot" selected>Fixed slots, cut with an ellipsis</option>
              <option value="grow">Opens on a tap; the card grows</option>
            </select>
          </label>
          <label class="tuning-slider">
            <span>Zoom Looks</span>
            <select id="tuning-zoom-looks">
              <option value="three" selected>Three looks, each held at one size</option>
              <option value="stepped">Stepped: five bands, a held size every press</option>
            </select>
          </label>
          <label class="tuning-slider">
            <span>Opened Directory</span>
            <select id="tuning-directory-layout">
              <option value="flow" selected>Flow: in order of use, a line for each pair</option>
              <option value="grid">Grid: no lines until a file is pinned</option>
            </select>
          </label>
          <label class="tuning-slider">
            <span>Closed Directory</span>
            <select id="tuning-closed-directory">
              <option value="cells" selected>Skin with cells: a cell for each file</option>
              <option value="box">Box: name and count</option>
              <option value="stack">Stack: cards waiting underneath</option>
            </select>
          </label>
          <label class="tuning-slider">
            <span>Hidden Files</span>
            <select id="tuning-hidden-files">
              <option value="under" selected>Cells under name</option>
              <option value="cells">Cells beside name</option>
              <option value="count">Count</option>
            </select>
          </label>
          <label class="tuning-slider">
            <span>Mirror Turn</span>
            <select id="tuning-mirror-turn">
              <option value="turn" selected>Turn</option>
              <option value="slide">Slide</option>
              <option value="cut">Cut</option>
            </select>
          </label>
          <label class="tuning-slider">
            <span>Unconnected</span>
            <select id="tuning-unconnected">
              <option value="folded" selected>Folded</option>
              <option value="dimmed">Dimmed</option>
              <option value="shown">Shown</option>
            </select>
          </label>
          <label class="tuning-slider">
            <span>Way Down</span>
            <select id="tuning-way-down">
              <option value="alone" selected>Folder Alone</option>
              <option value="question">Carries The Question</option>
            </select>
          </label>
          <label class="tuning-slider">
            <span>Arrival</span>
            <select id="tuning-arrival">
              <option value="then-neighbours-after" selected>Reading, Then Neighbours, Look After</option>
              <option value="reading">Reading Size</option>
              <option value="then-neighbours">Reading, Then Neighbours</option>
              <option value="then-neighbours-before">Reading, Then Neighbours, Look Before</option>
              <option value="neighbours">Neighbours</option>
            </select>
          </label>
          <label class="tuning-slider">
            <span>Arrival Waits</span>
            <select id="tuning-arrival-waits">
              <option value="attended" selected>While Pointed At Or Focused</option>
              <option value="never">Never</option>
              <option value="pointed">While Pointed At, Then A Rest More</option>
            </select>
          </label>
          <label class="tuning-slider">
            <span>Arrival Rest</span>
            <input type="range" id="tuning-arrival-rest" min="0.5" max="6" step="0.25" value="1.5" />
            <output id="tuning-arrival-rest-value">1.5</output>
          </label>
          <label class="tuning-slider">
            <span>Framing</span>
            <select id="tuning-framing">
              <option value="hand" selected>By Hand</option>
              <option value="follows">Follows Pins</option>
              <option value="follows-files">Follows Pins, Out To Files</option>
            </select>
          </label>
          <label class="tuning-slider">
            <span>Step</span>
            <select id="tuning-step">
              <option value="least" selected>Least Pan</option>
              <option value="whole">Whole</option>
              <option value="lines">With Its Lines</option>
            </select>
          </label>
          <label class="tuning-slider">
            <span>Cut Counted</span>
            <select id="tuning-cut-counted">
              <option value="off" selected>Off</option>
              <option value="on">On</option>
            </select>
          </label>
          <label class="tuning-slider" data-closed-cells-only>
            <span>Skin's Shape</span>
            <select id="tuning-closed-shape">
              <option value="tab" selected>Tab: a folder, its name on its tab</option>
              <option value="round">Round: a capsule</option>
              <option value="square">Square: a card's corners</option>
            </select>
          </label>
          <label class="tuning-slider" data-closed-cells-only>
            <span>Cells' Colour</span>
            <select id="tuning-closed-cells">
              <option value="kind" selected>By kind, as in 3D</option>
              <option value="grey">One grey</option>
            </select>
          </label>
          <label class="tuning-slider">
            <span>Zoomed Out Fully</span>
            <select id="tuning-overview-files">
              <option value="files" selected>Files only, as in Flow</option>
              <option value="keep">Cards keep their size</option>
            </select>
          </label>
          <label class="tuning-slider">
            <span>Descriptions Zoomed Out</span>
            <select id="tuning-descriptions-zoomed-out">
              <option value="hidden" selected>Hidden</option>
              <option value="first-line">First line, where the name leaves room</option>
              <option value="line-end">First line always, name cut at its end</option>
              <option value="line-middle">First line always, name cut in its middle</option>
            </select>
          </label>
          <label class="tuning-slider">
            <span>Slot Lines</span>
            <input type="range" id="tuning-slot-lines" min="1" max="4" step="1" value="2" />
            <output id="tuning-slot-lines-value">2</output>
          </label>
          <label class="tuning-slider">
            <span>Text Resistance</span>
            <input type="range" id="tuning-text-resistance" min="0" max="1" step="0.05" value="1" />
            <output id="tuning-text-resistance-value">1</output>
          </label>
          <label class="tuning-slider">
            <span>Name Growth</span>
            <input type="range" id="tuning-name-growth" min="1" max="3" step="0.1" value="1" />
            <output id="tuning-name-growth-value">1</output>
          </label>
          <label class="tuning-slider">
            <span>Control Resistance</span>
            <input type="range" id="tuning-control-resistance" min="0" max="1" step="0.05" value="1" />
            <output id="tuning-control-resistance-value">1</output>
          </label>
          <label class="tuning-slider">
            <span>Order Starts</span>
            <input type="range" id="tuning-order-starts" min="0" max="16" step="1" value="2" />
            <output id="tuning-order-starts-value">2</output>
          </label>
          <label class="tuning-slider">
            <span>Search Starts</span>
            <input type="range" id="tuning-search-starts" min="0" max="128" step="4" value="32" />
            <output id="tuning-search-starts-value">32</output>
          </label>
          <label class="tuning-slider">
            <span>Search Patience</span>
            <input type="range" id="tuning-search-patience" min="1" max="32" step="1" value="8" />
            <output id="tuning-search-patience-value">8</output>
          </label>
          <label class="tuning-slider">
            <span>Churn Cost</span>
            <input type="range" id="tuning-churn-cost" min="0" max="400" step="10" value="100" />
            <output id="tuning-churn-cost-value">100</output>
          </label>
        </details>
        <details class="tuning-subsection" data-tuning-perspective="3d">
          <summary class="subsection-label">3D Layout</summary>
          <details class="tuning-subsection" open>
            <summary class="subsection-label">Discovery</summary>
            <label class="tuning-slider">
              <span>Hops Shown</span><input type="range" id="tuning-force-hops" min="1" max="4" step="1" value="1" />
              <output id="tuning-force-hops-value">1</output>
            </label>
            <label class="tuning-slider">
              <span>Group Wrappers</span>
              <select id="tuning-force-group-wrappers">
                <option value="off">Off</option>
                <option value="skin" selected>Skin</option>
                <option value="cloud">Cloud</option>
                <option value="cloud-rim">Cloud, rim on hover</option>
              </select>
            </label>
            <label class="tuning-slider">
              <span>Beyond the Hops</span>
              <select id="tuning-force-beyond-hops">
                <option value="everything" selected>Everything</option>
                <option value="next-step">Next step</option>
              </select>
            </label>
            <label class="tuning-slider">
              <span>Shell Depth</span><input type="range" id="tuning-force-shell-depth" min="1" max="6" step="1" value="2" />
              <output id="tuning-force-shell-depth-value">2</output>
            </label>
            <label class="tuning-slider">
              <span>Reveal Frames</span><input type="range" id="tuning-force-reveal-frames" min="1" max="240" step="1" value="60" />
              <output id="tuning-force-reveal-frames-value">60</output>
            </label>
            <label class="tuning-slider">
              <span>Scan Growth</span>
              <select id="tuning-force-scan-growth">
                <option value="off" selected>Off</option>
                <option value="path">Path order</option>
                <option value="first-commit">First-commit order</option>
              </select>
            </label>
            <label class="tuning-slider">
              <span>Scan Pace</span>
              <select id="tuning-force-scan-pace">
                <option value="measured" selected>As measured</option>
                <option value="slower">Four times slower</option>
              </select>
            </label>
          </details>
          <details class="tuning-subsection" open>
            <summary class="subsection-label">Forces</summary>
            <label class="tuning-slider">
              <span>Repulsion</span><input type="range" id="tuning-force-charge" min="0" max="300" step="5" value="60" />
              <output id="tuning-force-charge-value">60</output>
            </label>
            <label class="tuning-slider">
              <span>Spring Strength</span><input type="range" id="tuning-force-link-strength" min="0" max="2" step="0.05" value="0.5" />
              <output id="tuning-force-link-strength-value">0.5</output>
            </label>
            <label class="tuning-slider">
              <span>Gravity</span><input type="range" id="tuning-force-gravity" min="0" max="0.3" step="0.005" value="0.025" />
              <output id="tuning-force-gravity-value">0.025</output>
            </label>
            <label class="tuning-slider">
              <span>Group Separation</span><input type="range" id="tuning-force-component-separation" min="0" max="0.95" step="0.05" value="0.2" />
              <output id="tuning-force-component-separation-value">0.2</output>
            </label>
            <label class="tuning-slider">
              <span>Tether</span><input type="range" id="tuning-force-tether" min="0" max="0.1" step="0.001" value="0.02" />
              <output id="tuning-force-tether-value">0.02</output>
            </label>
            <label class="tuning-slider">
              <span>Settle Hold</span><input type="range" id="tuning-force-settle-hold" min="0" max="0.1" step="0.001" value="0" />
              <output id="tuning-force-settle-hold-value">0</output>
            </label>
            <label class="tuning-slider">
              <span>Citing Pull</span><input type="range" id="tuning-force-cited-by-pull" min="0" max="1" step="0.05" value="1" />
              <output id="tuning-force-cited-by-pull-value">1</output>
            </label>
            <label class="tuning-slider">
              <span>Repulsion Reach</span><input type="range" id="tuning-force-charge-range" min="0" max="1000" step="10" value="0" />
              <output id="tuning-force-charge-range-value">0</output>
            </label>
            <label class="tuning-slider">
              <span>Update Energy</span><input type="range" id="tuning-force-update-energy" min="0" max="1" step="0.01" value="1" />
              <output id="tuning-force-update-energy-value">1</output>
            </label>
            <label class="tuning-slider">
              <span>Approximation</span><input type="range" id="tuning-force-approximation" min="0" max="0.5" step="0.05" value="0.3" />
              <output id="tuning-force-approximation-value">0.3</output>
            </label>
          </details>
          <details class="tuning-subsection" open>
            <summary class="subsection-label">Spacing</summary>
            <label class="tuning-slider">
              <span>Link Gap</span><input type="range" id="tuning-force-link-gap" min="8" max="200" step="2" value="60" />
              <output id="tuning-force-link-gap-value">60</output>
            </label>
            <label class="tuning-slider">
              <span>Coupling</span><input type="range" id="tuning-force-coupling" min="0" max="3" step="0.1" value="1" />
              <output id="tuning-force-coupling-value">1</output>
            </label>
            <label class="tuning-slider">
              <span>Clearance</span><input type="range" id="tuning-force-collision-gap" min="0" max="20" step="0.5" value="5" />
              <output id="tuning-force-collision-gap-value">5</output>
            </label>
          </details>
          <details class="tuning-subsection" open>
            <summary class="subsection-label">Appearance</summary>
            <label class="tuning-slider">
              <span>Base Radius</span><input type="range" id="tuning-force-node-size" min="1" max="10" step="0.25" value="4" />
              <output id="tuning-force-node-size-value">4</output>
            </label>
            <label class="tuning-slider">
              <span>Symbol Scaling</span><input type="range" id="tuning-force-symbol-scale" min="0" max="2" step="0.1" value="1" />
              <output id="tuning-force-symbol-scale-value">1</output>
            </label>
            <label class="tuning-slider">
              <span>Wire Thickness</span><input type="range" id="tuning-force-link-width" min="0.1" max="4" step="0.1" value="1" />
              <output id="tuning-force-link-width-value">1</output>
            </label>
            <label class="tuning-slider">
              <span>Node Zoom Resistance</span><input type="range" id="tuning-force-node-zoom-resistance" min="0" max="1" step="0.05" value="0.3" />
              <output id="tuning-force-node-zoom-resistance-value">0.3</output>
            </label>
            <label class="tuning-slider">
              <span>Name At</span><input type="range" id="tuning-force-name-at" min="4" max="60" step="1" value="18" />
              <output id="tuning-force-name-at-value">18</output>
            </label>
            <label class="tuning-slider">
              <span>Wire Zoom Resistance</span><input type="range" id="tuning-force-wire-zoom-resistance" min="0" max="1" step="0.05" value="0.9" />
              <output id="tuning-force-wire-zoom-resistance-value">0.9</output>
            </label>
          </details>
        </details>
        <details class="tuning-subsection" data-tuning-perspective="3d">
          <summary class="subsection-label">History</summary>
          <label class="tuning-slider">
            <span>Axis</span>
            <select id="tuning-history-axis">
              <option value="time">By date</option>
              <option value="steps">By step</option>
            </select>
          </label>
          <label class="tuning-slider">
            <span>Ticks</span>
            <select id="tuning-history-granularity">
              <option value="auto">Automatic</option>
              <option value="step">Every step</option>
              <option value="day">Days</option>
              <option value="week">Weeks</option>
              <option value="month">Months</option>
              <option value="salient">Salient only</option>
            </select>
          </label>
          <label class="tuning-slider">
            <span>Play Rate</span><input type="range" id="tuning-history-play-rate" min="0.5" max="10" step="0.5" value="2" />
            <output id="tuning-history-play-rate-value">2</output>
          </label>
          <label class="tuning-slider">
            <span>Changed Files</span>
            <select id="tuning-history-change-emphasis">
              <option value="glow">Glow</option>
              <option value="dim" selected>Dim the rest</option>
              <option value="both">Glow and dim the rest</option>
              <option value="none">No emphasis</option>
            </select>
          </label>
        </details>
        <details class="tuning-subsection" open>
          <summary class="subsection-label">Page</summary>
          <label class="tuning-slider">
            <span>Frame</span>
            <select id="tuning-frame">
              <option value="sidebar" selected>Sidebar</option>
              <option value="bare">Bare</option>
            </select>
          </label>
        </details>
        <button id="export-layout-settings" type="button" class="tuning-export">Export layout settings</button>
      </div>
    </details>

    <!-- Stats (at bottom) -->
    <div id="context-bar" class="sidebar-section sidebar-footer">
      <div id="stats-line">Loading…</div>
      <div>Context: <span id="context-name">None</span></div>
    </div>
  </div>

  <main id="main">
    <!-- One search for the whole Explorer; the second field, the end of a path, appears once anything is pinned -->
    <div id="search-bar" class="search-bar" role="search">
      <div class="search-field" id="search-subject-field">
        <input type="text" id="search-subject" class="search-input" placeholder="Search files, symbols and directories"
          aria-label="Search files, symbols and directories; a chosen one is pinned, and a path starts from the newest pin" autocomplete="off" />
        <kbd class="search-shortcut" aria-hidden="true">Ctrl+P</kbd>
        <div id="search-subject-results" class="search-results" hidden></div>
      </div>
      <span id="search-subject-absence" class="search-absence" hidden></span>
      <div class="search-field search-field--destination" id="search-destination-field" hidden>
        <svg class="search-marker" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 21s-6-5.6-6-10a6 6 0 0 1 12 0c0 4.4-6 10-6 10Z" />
          <circle cx="12" cy="11" r="2.5" />
        </svg>
        <input type="text" id="search-destination" class="search-input" placeholder="Path to…"
          aria-label="The end of a path from the newest pin" autocomplete="off" />
        <button type="button" id="search-destination-clear" class="search-clear" aria-label="Clear the path" hidden>&times;</button>
        <div id="search-destination-results" class="search-results" hidden></div>
      </div>
      <span id="search-destination-absence" class="search-absence" hidden></span>
    </div>

    <!-- One path report for both Local Map representations; other views keep the question without showing its report -->
    <section id="path-report" class="path-report" aria-label="Path result" hidden>
      <p id="pathfind-status" class="pathfind-status" role="status" aria-atomic="true" hidden></p>
      <ol id="pathfind-path" class="pathfind-path" aria-label="Path files, each is used by the next" hidden></ol>
    </section>

    <!-- The views, under the bar and report; the detail panel and the zoom controls stand over them -->
    <div id="views">
    <!-- While the bundle loads: a wordless sign where the map will be, gone before the first view draws or a refusal shows -->
    <div id="explorer-loading" class="explorer-loading" role="status" aria-label="Loading">
      <svg viewBox="0 0 44 12" width="44" height="12" aria-hidden="true"><circle cx="6" cy="6" r="4" /><circle cx="22" cy="6" r="4" /><circle cx="38" cy="6" r="4" /></svg>
    </div>
    <div id="view-world" class="view-container">
      <div id="world-root" class="world-root"></div>
    </div>

    <div id="view-sources" class="view-container">
      <div id="sources-container" class="sources-view"></div>
    </div>

    <div id="view-map" class="view-container">
      <div id="map-viewport" class="viewport-layer">
        <div id="map-container" class="dom-layer"></div>
        <div id="map-connections" class="connections-layer"></div>
      </div>
    </div>

    <div id="view-graph" class="view-container">
      <div id="graph-svg"></div>
    </div>

    <!-- Floating zoom controls -->
    <div id="controls">
      <button class="control-btn" data-zoom="in" aria-label="Zoom In" title="Zoom in">+</button>
      <button class="control-btn" data-zoom="out" aria-label="Zoom Out" title="Zoom out">-</button>
      <button class="control-btn" data-zoom="reset" aria-label="Return to reading size" title="Return to reading size, framed as on arrival, on the subject or the newest pin">⟲</button>
    </div>

    <!-- Detail panel (right sidebar) -->
    <div id="detail-panel" role="complementary" aria-labelledby="detail-title" aria-hidden="true" inert>
      <div class="detail-header">
        <div class="detail-navigation">
          <button id="reader-back" class="sidebar-toggle-btn history-btn" title="Back" aria-label="Back" disabled>←</button>
          <button id="reader-forward" class="sidebar-toggle-btn history-btn" title="Forward" aria-label="Forward" disabled>→</button>
        </div>
        <h2 id="detail-title">Select a Node</h2>
        <button id="detail-close" class="detail-close" aria-label="Close details">×</button>
      </div>
      <div id="detail-body" class="detail-scroll">
        <p class="detail-placeholder">Click on any node to view details.</p>
      </div>
      <div class="detail-footer">
        <button class="action-btn ghost" id="download-doc-btn">Download Markdown</button>
      </div>
    </div>
    </div>
  </main>

  <!-- The page's one polite status region (client/announce.ts): what happens, said without moving focus -->
  <div id="page-status" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- A classic deferred script, which a page opened as a file still runs, so that it can say it must be served. -->
  <script defer src="./static/index.js"></script>
</body>

</html>
