<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Live Docs Explorer</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <script src="//unpkg.com/3d-force-graph"></script>
</head>
<body>
  <!-- Omnisearch (VS Code Command Palette style) -->
  <div id="omnisearch" class="omnisearch" hidden>
    <div class="omnisearch-backdrop"></div>
    <div class="omnisearch-dialog">
      <input type="text" id="omnisearch-input" class="omnisearch-input" placeholder="Search files and symbols..." autocomplete="off" />
      <div id="omnisearch-results" class="omnisearch-results"></div>
    </div>
  </div>

  <div id="sidebar">
    <div class="sidebar-header">Live Docs Explorer</div>
    
    <!-- View Navigation -->
    <div class="sidebar-section">
      <div class="nav-item active" data-view="circuit" onclick="switchView(event, 'circuit')">
        <span class="nav-icon">⚡</span><span>Circuit Board</span>
      </div>
      <div class="nav-item" data-view="map" onclick="switchView(event, 'map')">
        <span class="nav-icon">🗺️</span><span>Local Map</span>
      </div>
      <div class="nav-item" data-view="graph" onclick="switchView(event, 'graph')">
        <span class="nav-icon">🌐</span><span>Force Graph</span>
      </div>
    </div>

    <!-- Search Trigger -->
    <div class="sidebar-section">
      <button id="omnisearch-trigger" class="sidebar-search-btn" onclick="openOmnisearch()">
        <span class="search-icon">🔍</span>
        <span>Search...</span>
        <kbd class="search-shortcut">Ctrl+P</kbd>
      </button>
    </div>

    <!-- Display Filters -->
    <div class="sidebar-section">
      <div class="section-label">Display</div>
      <label class="sidebar-checkbox">
        <input id="filter-toggle-tests" type="checkbox" />
        <span>Show Tests</span>
      </label>
      <label class="sidebar-checkbox">
        <input id="filter-toggle-assets" type="checkbox" />
        <span>Show Assets</span>
      </label>
    </div>

    <!-- Tuning Controls (collapsible) -->
    <details class="sidebar-section sidebar-details">
      <summary class="section-label clickable">Tuning</summary>
      <div class="tuning-content">
        <div class="tuning-subsection">
          <div class="subsection-label">Bezier Curve</div>
          <label class="tuning-slider">
            <span>Stub Factor</span>
            <input type="range" id="tuning-stub-factor" min="0.1" max="0.8" step="0.01" value="0.8" />
            <output id="tuning-stub-factor-value">0.8</output>
          </label>
          <label class="tuning-slider">
            <span>Stub Min</span>
            <input type="range" id="tuning-stub-min" min="8" max="64" step="2" value="8" />
            <output id="tuning-stub-min-value">8</output>
          </label>
          <label class="tuning-slider">
            <span>Stub Max Offset</span>
            <input type="range" id="tuning-stub-max-offset" min="8" max="64" step="2" value="40" />
            <output id="tuning-stub-max-offset-value">40</output>
          </label>
          <label class="tuning-slider">
            <span>Vertical Offset</span>
            <input type="range" id="tuning-vertical-offset" min="0" max="0.5" step="0.02" value="0" />
            <output id="tuning-vertical-offset-value">0</output>
          </label>
        </div>
        <div class="tuning-subsection">
          <div class="subsection-label">Click Behavior</div>
          <label class="sidebar-checkbox">
            <input type="checkbox" id="tuning-single-click-focus" checked />
            <span>Single-click focuses only</span>
          </label>
          <label class="sidebar-checkbox">
            <input type="checkbox" id="tuning-double-click-recenter" checked />
            <span>Double-click recenters</span>
          </label>
        </div>
        <div class="tuning-subsection">
          <div class="subsection-label">Visual</div>
          <label class="sidebar-checkbox">
            <input type="checkbox" id="tuning-type-badges" />
            <span>Type reference badges</span>
          </label>
          <label class="sidebar-checkbox">
            <input type="checkbox" id="tuning-alchemy-glow" />
            <span>Alchemy glow</span>
          </label>
        </div>
        <div class="tuning-subsection">
          <div class="subsection-label">Local Map</div>
          <label class="tuning-slider">
            <span>Column Gap</span>
            <input type="range" id="tuning-column-gap" min="24" max="160" step="4" value="100" />
            <output id="tuning-column-gap-value">100</output>
          </label>
          <label class="tuning-slider">
            <span>Hover Dim (Symbols)</span>
            <input type="range" id="tuning-hover-dim-symbols" min="0.1" max="0.8" step="0.05" value="0.4" />
            <output id="tuning-hover-dim-symbols-value">0.4</output>
          </label>
          <label class="tuning-slider">
            <span>Hover Dim (Lines)</span>
            <input type="range" id="tuning-hover-dim-connections" min="0.1" max="0.8" step="0.05" value="0.4" />
            <output id="tuning-hover-dim-connections-value">0.4</output>
          </label>
          <label class="tuning-slider">
            <span>Self-Loop Taper</span>
            <input type="range" id="tuning-self-loop-taper" min="0" max="1" step="0.1" value="0.2" />
            <output id="tuning-self-loop-taper-value">0.2</output>
          </label>
        </div>
      </div>
    </details>

    <!-- Legend -->
    <div class="sidebar-section">
      <div class="section-label">Legend</div>
      <div class="legend-row">
        <span class="legend-swatch legend-swatch--outbound"></span>
        <span>Outbound dependency</span>
      </div>
      <div class="legend-row">
        <span class="legend-swatch legend-swatch--inbound"></span>
        <span>Inbound dependency</span>
      </div>
      <div class="legend-row">
        <span class="legend-symbol legend-symbol--outbound"></span>
        <span>Outbound pin</span>
      </div>
      <div class="legend-row">
        <span class="legend-symbol legend-symbol--inbound"></span>
        <span>Inbound pin</span>
      </div>
      <div class="legend-row">
        <span class="legend-shadow"></span>
        <span>Test-backed</span>
      </div>
    </div>

    <!-- Stats (at bottom) -->
    <div id="context-bar" class="sidebar-section sidebar-footer">
      <div id="stats-line">Loading...</div>
      <div>Context: <span id="context-name">None</span></div>
    </div>
  </div>

  <div id="main">
    <div id="view-circuit" class="view-container active">
      <div id="circuit-viewport">
        <div id="circuit-container" class="dom-layer"></div>
        <div id="circuit-connections" class="connections-layer"></div>
      </div>
    </div>

    <div id="view-map" class="view-container">
      <div id="map-viewport" class="viewport-layer">
        <div id="map-container" class="dom-layer"></div>
        <div id="map-connections" class="connections-layer"></div>
      </div>
    </div>

    <div id="view-graph" class="view-container">
      <div id="graph-svg"></div>
    </div>

    <!-- Floating zoom controls -->
    <div id="controls">
      <button class="control-btn" onclick="zoomIn()" aria-label="Zoom In">+</button>
      <button class="control-btn" onclick="zoomOut()" aria-label="Zoom Out">-</button>
      <button class="control-btn" onclick="resetZoom()" aria-label="Reset Zoom">⟲</button>
    </div>

    <!-- Detail panel (right sidebar) -->
    <div id="detail-panel">
      <div class="detail-header">
        <h2 id="detail-title">Select a Node</h2>
        <button id="detail-close" class="detail-close" aria-label="Close details">×</button>
      </div>
      <div id="detail-body" class="detail-scroll">
        <p class="detail-placeholder">Click on any node to view details.</p>
      </div>
      <div class="detail-footer">
        <button class="action-btn ghost" onclick="openInCircuitBoard()">Open in Circuit Board</button>
        <button class="action-btn ghost" onclick="openInLocalView()">Open in Local View</button>
        <button class="action-btn ghost" onclick="openInGraphView()">Open in Graph View</button>
        <button class="action-btn" onclick="openInEditor()" id="open-in-editor-btn">Open in Editor</button>
      </div>
    </div>
  </div>

  <script type="module" src="/static/index.js"></script>
</body>
</html>
