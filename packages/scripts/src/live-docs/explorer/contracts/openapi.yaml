openapi: 3.1.0
info:
  title: Live Documentation Explorer
  version: 0.1.0
  description: >-
    Minimal HTTP server used by the Live Documentation Explorer UI.
    This contract reflects the current implementation in
    packages/scripts/src/live-docs/explorer/server/index.ts.
servers:
  - url: http://localhost:3000
    description: Default local explorer server
paths:
  /:
    get:
      summary: Serve the Explorer UI shell
      operationId: getExplorerIndex
      responses:
        "200":
          description: Explorer HTML
          content:
            text/html:
              schema:
                type: string
  /graph:
    get:
      summary: Retrieve the full Explorer graph payload
      operationId: getExplorerGraph
      parameters:
        - in: query
          name: refresh
          required: false
          description: When set to `1`, rebuilds the graph before returning it.
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: Explorer graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExplorerGraphPayload"
  /details:
    get:
      summary: Retrieve detail payload for a single Live Doc
      operationId: getExplorerDetails
      parameters:
        - in: query
          name: docPath
          required: true
          description: Workspace-relative doc path (e.g. `.mdmd/layer-4/packages/shared/src/index.ts.mdmd.md`).
          schema:
            type: string
      responses:
        "200":
          description: Details payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExplorerDetailPayload"
        "400":
          description: Missing/invalid docPath
        "404":
          description: Node not found
  /open:
    get:
      summary: Open a code file in VS Code
      operationId: openInEditor
      parameters:
        - in: query
          name: codePath
          required: true
          description: Absolute path to a file within the workspace.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
        "400":
          description: Missing/invalid codePath
  /local-map:
    get:
      summary: Retrieve headless JSON Local Map data for a node
      operationId: getLocalMap
      parameters:
        - in: query
          name: nodeId
          required: true
          description: Node id (code path) to focus on.
          schema:
            type: string
        - in: query
          name: pretty
          required: false
          description: When set to `1`, pretty-prints the JSON.
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: Local Map data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalMapData"
        "400":
          description: Missing nodeId
        "404":
          description: Node not found
components:
  schemas:
    ExplorerLinkKind:
      type: string
      description: Explorer edge kind (open-ended).
    ExplorerDependencyReference:
      type: object
      additionalProperties: false
      required: [label, raw, resolved, kind]
      properties:
        targetId:
          type: string
        targetDocPath:
          type: string
        targetSymbol:
          type: string
        sourceSymbol:
          type: string
        label:
          type: string
        raw:
          type: string
        resolved:
          type: boolean
        kind:
          $ref: "#/components/schemas/ExplorerLinkKind"
    ExplorerTypeReference:
      type: object
      additionalProperties: false
      required: [typeName, role, isResolved]
      properties:
        typeName:
          type: string
        role:
          type: string
          enum: [return, parameter, extends, implements, constraint]
        parameterName:
          type: string
        isResolved:
          type: boolean
        targetId:
          type: string
        targetAnchor:
          type: string
    ExplorerPublicSymbol:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
        typeReferences:
          type: array
          items:
            $ref: "#/components/schemas/ExplorerTypeReference"
    ExplorerNodePayload:
      type: object
      additionalProperties: true
      required:
        - id
        - name
        - codePath
        - codeRelativePath
        - docPath
        - docRelativePath
        - archetype
        - dependencies
        - dependents
        - missingDependencies
        - publicSymbols
      properties:
        id:
          type: string
        name:
          type: string
        codePath:
          type: string
        codeRelativePath:
          type: string
        docPath:
          type: string
        docRelativePath:
          type: string
        archetype:
          type: string
        dependencies:
          type: array
          items:
            $ref: "#/components/schemas/ExplorerDependencyReference"
        dependents:
          type: array
          items:
            type: string
        missingDependencies:
          type: array
          items:
            $ref: "#/components/schemas/ExplorerDependencyReference"
        publicSymbols:
          type: array
          items:
            type: string
        publicSymbolsExtended:
          type: array
          items:
            $ref: "#/components/schemas/ExplorerPublicSymbol"
        symbolDocumentation:
          type: object
          additionalProperties: true
          nullable: true
    ExplorerLinkPayload:
      type: object
      additionalProperties: true
      required: [source, target, kind]
      properties:
        source:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
        target:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
        kind:
          $ref: "#/components/schemas/ExplorerLinkKind"
        sourceSymbol:
          type: string
        targetSymbol:
          type: string
    ExplorerGraphStats:
      type: object
      additionalProperties: false
      required: [nodes, links, missingDependencies]
      properties:
        nodes:
          type: number
        links:
          type: number
        missingDependencies:
          type: number
    ExplorerGraphPayload:
      type: object
      additionalProperties: false
      required: [nodes, links, stats]
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/ExplorerNodePayload"
        links:
          type: array
          items:
            $ref: "#/components/schemas/ExplorerLinkPayload"
        stats:
          $ref: "#/components/schemas/ExplorerGraphStats"
    ExplorerDetailPayload:
      type: object
      additionalProperties: true
      required:
        - archetype
        - purpose
        - publicSymbols
        - dependencies
        - dependents
        - missingDependencies
        - docRelativePath
        - codeRelativePath
      properties:
        archetype:
          type: string
        purpose:
          type: string
        publicSymbols:
          type: array
          items:
            type: string
        dependencies:
          type: array
          items:
            $ref: "#/components/schemas/ExplorerDependencyReference"
        dependents:
          type: array
          items:
            type: string
        missingDependencies:
          type: array
          items:
            $ref: "#/components/schemas/ExplorerDependencyReference"
        docRelativePath:
          type: string
        codeRelativePath:
          type: string
        symbolDocumentation:
          type: object
          additionalProperties: true
          nullable: true
    LocalMapData:
      type: object
      additionalProperties: true
      required: [focusNodeId, center, upstream, downstream, edges, symbolAnchors, stats, metadata]
      properties:
        focusNodeId:
          type: string
        center:
          type: object
          additionalProperties: true
        upstream:
          type: array
          items:
            type: object
            additionalProperties: true
        downstream:
          type: array
          items:
            type: object
            additionalProperties: true
        edges:
          type: array
          items:
            type: object
            additionalProperties: true
        symbolAnchors:
          type: array
          items:
            type: object
            additionalProperties: true
        stats:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
          format: uuid
        triggerArtifactId:
          type: string
          format: uuid
        message:
          type: string
        severity:
          type: string
          enum: [warning, info, hint]
        status:
          $ref: "#/components/schemas/DiagnosticStatus"
        createdAt:
          type: string
          format: date-time
        acknowledgedAt:
          type: string
          format: date-time
          nullable: true
        acknowledgedBy:
          type: string
          nullable: true
        linkIds:
          type: array
          items:
            type: string
            format: uuid
        llmAssessment:
          # Descoped 2026-02-17: LLM integration removed from project scope.
          $ref: "#/components/schemas/LLMAssessment"
          nullable: true
          deprecated: true
    AcknowledgementInput:
      type: object
      required: [actor]
      properties:
        actor:
          type: string
        notes:
          type: string
          nullable: true
    DismissInput:
      type: object
      required: [actor, reason]
      properties:
        actor:
          type: string
        reason:
          type: string
        expiresAt:
          type: string
          format: date-time
          nullable: true
    LLMEvaluationInput:
      # Descoped 2026-02-17: LLM integration removed from project scope.
      deprecated: true
      type: object
      required: [diagnosticIds]
      properties:
        diagnosticIds:
          type: array
          items:
            type: string
            format: uuid
        promptContext:
          type: string
          nullable: true
    LLMEvaluationTicket:
      # Descoped 2026-02-17: LLM integration removed from project scope.
      deprecated: true
      type: object
      properties:
        ticketId:
          type: string
        status:
          type: string
          enum: [queued, running, complete]
        estimatedCompletionSeconds:
          type: integer
          nullable: true
    LLMAssessment:
      # Descoped 2026-02-17: LLM integration removed from project scope.
      deprecated: true
      type: object
      properties:
        summary:
          type: string
        confidence:
          type: number
          format: float
        recommendedActions:
          type: array
          items:
            type: string
