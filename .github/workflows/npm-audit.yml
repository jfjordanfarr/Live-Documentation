name: npm audit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (moderate check)
        id: audit-moderate
        continue-on-error: true
        run: |
          set +e
          npm audit --audit-level=moderate --json > npm-audit.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Warn on moderate vulnerabilities
        if: steps.audit-moderate.outputs.exit_code != '0'
        run: |
          echo "::warning::npm audit found moderate or higher vulnerabilities. Review npm-audit.json artifact."

      - name: Check for high/critical vulnerabilities
        id: audit-high
        run: |
          set +e
          npm audit --audit-level=high
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit
          path: npm-audit.json

      - name: Fail if high/critical vulnerabilities found
        if: steps.audit-high.outputs.exit_code != '0'
        run: |
          echo "::error::npm audit found HIGH or CRITICAL vulnerabilities. Blocking."
          exit 1
