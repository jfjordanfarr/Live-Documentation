name: GitHub Pages (Static Explorer)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Keep the active history build so it can save its cache. GitHub retains the
  # newest pending run when later pushes replace an older pending run.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A cold run regenerates the whole mainline; warm runs reuse the lens cache.
    timeout-minutes: 180
    outputs:
      # 0 a whole history, 3 stopped at its budget, anything else (or nothing, on a timeout) a failure.
      history-code: ${{ steps.history.outputs.code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The history command reads the first-parent mainline back to its beginning.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Restore history summaries
        id: history-cache
        uses: actions/cache/restore@v6
        with:
          path: .mdmd/history
          # Each run gets a new immutable cache, and the prefix restores the
          # newest. Which summaries are reused is the history command's lens's
          # to decide: it keys on the code that makes a summary and on the
          # configuration, so an edit that cannot change a summary keeps them.
          key: history-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            history-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Compute complete mainline history
        id: history
        # The site deploys whether or not the history is whole. The command
        # starts no commit after its budget and then writes no history (exit
        # 3); each run resumes from the cache the last one saved. Beside the
        # current lens's cache only the newest whole one is kept, and it goes
        # once the current one is whole.
        continue-on-error: true
        timeout-minutes: 160
        env:
          CI: "true"
        run: |
          set +e
          npm run live-docs:history -- --remove-superseded --stop-after 140
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Save history summaries
        # Every run that reached the history step saves what it summarized, so that the next one resumes.
        if: ${{ always() && contains(fromJSON('["success", "failure", "cancelled"]'), steps.history.outcome) }}
        uses: actions/cache/save@v6
        with:
          path: .mdmd/history
          key: ${{ steps.history-cache.outputs.cache-primary-key }}

      - name: Build static explorer bundle
        env:
          CI: "true"
        # Only this run's whole history is published; never an earlier run's, or another lens's.
        run: npm run live-docs:visualize -- --history ${{ steps.history.outcome == 'success' && 'all' || 'none' }}

      - name: Say the site carries no history
        if: ${{ steps.history.outcome != 'success' }}
        run: |
          if [ "${{ steps.history.outputs.code }}" = "3" ]; then why="stopped at its budget before the cache held every commit under the current lens"; else why="failed; its log says why, and the run ends red once the site is deployed"; fi
          echo "### Deployed without its history" >> "$GITHUB_STEP_SUMMARY"
          echo "The history step $why. The site was built without a history. The next run resumes from the cache this one saved." >> "$GITHUB_STEP_SUMMARY"

      - name: Disable Jekyll
        run: touch dist/explorer/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/explorer

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  history-verdict:
    # A history that failed, other than by stopping at its budget, still lets the site deploy without it, and then
    # ends the run red, so that a broken history is never a quiet green run.
    needs: [build, deploy]
    if: ${{ always() && needs.build.result == 'success' && needs.build.outputs.history-code != '0' && needs.build.outputs.history-code != '3' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report the failed history
        run: |
          echo "::error title=Compute complete mainline history::The history step failed (exit ${{ needs.build.outputs.history-code || 'none: the step timed out' }}); the site was deployed without its history."
          exit 1
