name: GitHub Pages (Static Explorer)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Keep the active history build so it can save its cache. GitHub retains the
  # newest pending run when later pushes replace an older pending run.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A cold run regenerates the whole mainline; warm runs reuse the lens cache.
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The history command reads the first-parent mainline back to its beginning.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Restore history summaries
        id: history-cache
        uses: actions/cache/restore@v4
        with:
          path: .mdmd/history
          # Each run gets a new immutable cache, and the prefix restores the
          # newest. Which summaries are reused is the history command's lens's
          # to decide: it keys on the code that makes a summary and on the
          # configuration, so an edit that cannot change a summary keeps them.
          key: history-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            history-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Compute complete mainline history
        id: history
        # A cold run regenerates every commit. Stopping the step before the job
        # times out lets the next step save what it finished, so that the next
        # run resumes rather than starting cold again.
        timeout-minutes: 160
        env:
          CI: "true"
        # The pool is sized by the runner's memory and processors; the caches
        # of other lenses are removed, so the saved cache holds the current one.
        run: npm run live-docs:history -- --remove-superseded

      - name: Save history summaries
        # A failed generation can still leave valid, atomically written commit
        # summaries that shorten the next run. The job remains failed.
        if: ${{ !cancelled() && steps.history.outcome != 'skipped' }}
        uses: actions/cache/save@v4
        with:
          path: .mdmd/history
          key: ${{ steps.history-cache.outputs.cache-primary-key }}

      - name: Build static explorer bundle
        env:
          CI: "true"
        run: npm run live-docs:visualize -- --history all

      - name: Disable Jekyll
        run: touch dist/explorer/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/explorer

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
