name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs when a new commit is pushed to the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The whole history: the history tests read this repository's own renames of September 2026.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run CI checks (safe-to-commit CI mode)
        env:
          CI: "true"
        run: npm run ci-check
