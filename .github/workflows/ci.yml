name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs when a new commit is pushed to the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache VS Code test downloads
        uses: actions/cache@v4
        with:
          path: .vscode-test
          key: ${{ runner.os }}-vscode-test-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vscode-test-

      - name: Install dependencies
        # The lockfile generated on Windows omits Linux platform binaries for Rollup.
        # npm has a known bug (https://github.com/npm/cli/issues/4828) where optional
        # deps aren't properly resolved from cross-platform lockfiles. We explicitly
        # install the Linux Rollup binary after the main install to work around this.
        run: |
          npm ci
          npm install @rollup/rollup-linux-x64-gnu --no-save --ignore-scripts

      - name: Install xvfb (for integration tests)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run CI checks (safe-to-commit CI mode)
        env:
          CI: "true"
        run: xvfb-run -a npm run ci-check

      - name: Run network usage audit
        # Static analysis proving all network usage is localhost-only or browser-side
        run: npm run audit:network

      # Network isolation test: prove unit tests don't need internet
      # We unset http_proxy/https_proxy and set a bogus DNS to prove no network calls
      - name: Run unit tests (simulated network isolation)
        run: |
          echo "🔒 Running unit tests with simulated network isolation"
          echo "   Unsetting proxy vars and blocking external DNS resolution..."
          npm run test:unit
        env:
          CI: "true"
          # Block any HTTP proxy that might be set
          http_proxy: ""
          https_proxy: ""
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          # Ensure no fallback to external services
          NODE_TLS_REJECT_UNAUTHORIZED: "1"
