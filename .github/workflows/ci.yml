name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs when a new commit is pushed to the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache VS Code test downloads
        uses: actions/cache@v4
        with:
          path: .vscode-test
          key: ${{ runner.os }}-vscode-test-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vscode-test-

      - name: Install dependencies
        # Use `npm install` instead of `npm ci` to handle cross-platform optional
        # dependencies (e.g., @rollup/rollup-linux-x64-gnu). The lockfile generated
        # on Windows omits Linux platform binaries; `npm install` adds them for the
        # current platform while still respecting the lockfile for version resolution.
        run: npm install

      - name: Install xvfb (for integration tests)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run CI checks (safe-to-commit CI mode)
        env:
          CI: "true"
        run: xvfb-run -a npm run ci-check
