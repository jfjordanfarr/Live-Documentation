name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache VS Code test downloads
        uses: actions/cache@v5
        with:
          path: .vscode-test
          key: ${{ runner.os }}-vscode-test-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vscode-test-

      - name: Install dependencies
        run: npm ci

      - name: Install xvfb (for integration tests)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run CI checks (safe-to-commit CI mode)
        env:
          CI: "true"
        run: xvfb-run -a npm run ci-check
