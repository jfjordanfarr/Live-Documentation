version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # Held at 1.61.1, pinned exactly in package.json: the headless Chromium of Playwright 1.62 and later (151 on)
      # does not reach the host's graphics card through Mesa's d3d12 driver, and the browser suite then stops on its
      # first line. Lift this when a later release's browser draws on the card under the suite's launch, as
      # AI-Agent-Workspace/AgentSessionHistory/2026/11/2026-11-19/Probes/playwright-upgrade/README.md shows how to test.
      - dependency-name: "@playwright/test"
        versions: [">= 1.62.0"]
    groups:
      # Group all minor/patch dev dependencies into a single PR
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      # Group all minor/patch production dependencies
      prod-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Group all GitHub Actions updates into a single PR
      actions:
        patterns:
          - "*"
