<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-YGvTb90PhZCaSH9xd5ZWbmoZety+l5Sr3vr3LoW2Fl0='; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What a scan reads</title>
<style>
  :root {
    --ground-page: #18181a; --ground-surface: #1e1e1e; --ground-raised: #1f1f22; --ground-card: #232326; --ground-hover: #2f2f33;
    --ground-control: #333333; --ground-deep: #111111; --line-border: #2f2f34; --line-interactive: #3f3f46; --line-hover: #777777;
    --text-strong: #ffffff; --text-normal: #e4e4e4; --text-secondary: #cccccc; --text-muted: #939393; --offers: #38bdf8; --focus: #0091ff;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  /* The header and the footer hold their places and the page between them scrolls, so nothing ever sits under either. */
  body { margin: 0; height: 100vh; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--ground-page); color: var(--text-normal); font: 13px/1.5 system-ui, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 20px; background: var(--ground-raised); border-bottom: 1px solid var(--line-border); }
  h1 { margin: 0 12px 0 0; font-size: 15px; color: var(--text-strong); font-weight: 600; }
  h2 { font-size: 13px; color: var(--text-strong); margin: 14px 0 8px; font-weight: 600; }
  h3 { font-size: 12px; color: var(--text-secondary); margin: 12px 0 4px; font-weight: 600; }
  main { overflow: auto; padding: 0 20px 24px; scroll-padding-top: 112px; }
  main > section { max-width: 1240px; }
  /* The totals and Scan stay in view while what is below them scrolls. */
  .summary { position: sticky; top: 0; z-index: 2; padding: 12px 0 10px; background: var(--ground-page); border-bottom: 1px solid var(--line-border); margin-bottom: 8px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  #totals { font-size: 14px; color: var(--text-strong); margin: 0; }
  button, .choose { font: inherit; color: var(--text-normal); background: var(--ground-control); border: 1px solid var(--line-interactive); border-radius: 4px; padding: 4px 10px; display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  button:hover, .choose:hover { border-color: var(--line-hover); }
  button:focus-visible, .choose:focus-within, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .offered { color: var(--offers); border-color: var(--offers); }
  .icon { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .choose input, .hidden-input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  #drop { border: 1px dashed var(--offers); border-radius: 6px; padding: 4px 12px; color: var(--offers); display: inline-flex; gap: 6px; align-items: center; }
  #folder-name { color: var(--text-strong); font-weight: 600; }
  .quiet, .counts { color: var(--text-muted); }
  .counts { white-space: nowrap; }
  ul { list-style: none; margin: 0; padding: 0; }
  code, .path, textarea { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; }
  /* The notice of ignore files found: one line, three choices for all of them, the files behind a disclosure. */
  #found { border: 1px solid var(--line-interactive); border-radius: 6px; background: var(--ground-card); padding: 8px 12px; margin: 4px 0 10px; }
  #found .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #found .what { flex: 1; min-width: 0; color: var(--text-strong); }
  #found-files { margin: 6px 0 0 26px; }
  #found-files li { display: flex; gap: 10px; align-items: center; min-height: 26px; }
  #found-said { color: var(--text-secondary); margin: 6px 0 0 26px; }
  .columns { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1.3fr) minmax(0, 1fr); gap: 24px; align-items: start; }
  /* The list, the truth: text to edit, its tools above it. */
  .list-tools { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
  #list { width: 100%; min-height: 420px; height: calc(100vh - 330px); resize: vertical; color: var(--text-normal); background: var(--ground-deep); border: 1px solid var(--line-interactive); border-radius: 4px; padding: 8px; line-height: 1.55; white-space: pre; }
  .case { display: inline-flex; gap: 6px; align-items: center; color: var(--text-secondary); margin-top: 6px; }
  .twisty, .icon-button { padding: 2px; background: transparent; border-color: transparent; }
  .twisty-space, .icon-space { width: 22px; flex: none; }
  .text-button { background: transparent; border: 0; color: var(--offers); padding: 4px 0; }
  .row { display: flex; gap: 8px; align-items: center; min-height: 28px; padding: 1px 2px; }
  .row .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .number { color: var(--text-muted); font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; min-width: 24px; text-align: right; }
  .kinds { display: block; color: var(--text-muted); font-family: system-ui, "Segoe UI", sans-serif; }
  .line-row { border-bottom: 1px solid var(--line-border); }
  .members { padding: 0 0 6px 30px; }
  /* A row's own act is an icon alone, quiet until the row is pointed at or the button has the focus. */
  .quiet-act { color: var(--text-muted); }
  .row:hover .quiet-act, .quiet-act:focus-visible { color: var(--offers); }
  #notes { margin-top: 10px; }
  #notes li { color: var(--text-secondary); padding: 2px 0; }
  #scan { border-color: var(--offers); color: var(--offers); }
  .menu { position: relative; display: inline-block; }
  .menu ul { position: absolute; z-index: 3; top: 100%; left: 0; min-width: 220px; background: var(--ground-card); border: 1px solid var(--line-interactive); border-radius: 4px; padding: 4px; }
  .menu li button { width: 100%; background: transparent; border-color: transparent; }
  footer { padding: 4px 20px; font-size: 11px; color: var(--text-muted); background: var(--ground-raised); border-top: 1px solid var(--line-border); }
</style>
</head>
<body>
<header>
  <h1>What a scan reads</h1>
  <button id="pick" type="button" class="offered" data-icon="pick" aria-label="Pick a folder">Pick</button>
  <span id="drop" data-icon="drop" aria-label="Drop a folder here">Drop here</span>
  <label class="choose" data-icon="input" aria-label="Choose a folder: every file is listed first">Choose<input id="folder-input" type="file" webkitdirectory></label>
  <span id="folder-name"></span>
  <span id="progress" class="quiet" role="status"></span>
</header>
<main>
  <section id="choice" hidden>
    <div class="summary">
      <p id="totals"></p>
      <button id="scan" type="button" data-icon="scan" aria-label="Scan what is kept">Scan</button>
      <span id="scan-result" role="status"></span>
    </div>
    <div id="found" hidden>
      <div class="row">
        <button id="found-open" type="button" class="twisty" aria-expanded="false" aria-label="Show the files found"></button>
        <span class="what" id="found-what"></span>
        <button type="button" data-take="use" title="Replace your list with their lines">Use</button>
        <button type="button" data-take="add" title="Add their lines to your list">Add</button>
        <button type="button" data-take="ignore" title="Leave your list as it is">Ignore</button>
      </div>
      <ul id="found-files" hidden></ul>
      <p id="found-said" hidden></p>
    </div>
    <div class="columns">
      <div>
        <h2>Your list</h2>
        <div class="list-tools">
          <span class="menu"><button id="prefill" type="button" class="icon-button" aria-haspopup="true" aria-expanded="false" aria-label="Fill from a starting list" title="Fill from a starting list" data-icon="prefill"></button>
            <ul id="prefill-menu" hidden>
              <li><button type="button" data-prefill="visual-studio">Visual Studio</button></li>
              <li><button type="button" data-prefill="what-it-holds">From what the folders hold</button></li>
            </ul>
          </span>
          <button id="copy" type="button" class="icon-button" aria-label="Copy the list" title="Copy the list" data-icon="copy"></button>
          <button id="save" type="button" class="icon-button" aria-label="Save the list as a file" title="Save the list as a file" data-icon="save"></button>
          <label class="icon-button choose" aria-label="Load a list from a file" title="Load a list from a file" data-icon="load"><input id="load" type="file" accept=".txt,.gitignore,.tfignore,text/plain"></label>
          <button id="clear" type="button" class="icon-button" aria-label="Empty the list" title="Empty the list" data-icon="remove"></button>
          <span id="list-said" class="quiet" role="status"></span>
        </div>
        <textarea id="list" spellcheck="false" aria-label="Your list: one pattern a line, as in a .gitignore"></textarea>
        <label class="case"><input id="ignore-case" type="checkbox"> Names match without case</label>
        <ul id="notes" hidden></ul>
      </div>
      <div><h2>Left out</h2><ul id="by-line"></ul></div>
      <div><h2>Will be read</h2><div id="read"></div></div>
    </div>
  </section>
</main>
<footer id="timings"></footer>
